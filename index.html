<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="dashboard">

    <!-- SESSION CARDS -->

    <section class="session-grid">

        <div class="session-card">

            <div class="session-name">

                🇯🇵 TOKYO

            </div>

            <div id="tokyoClock" class="clock">

                00:00:00

            </div>

            <div id="tokyoStatus" class="status">

                OPEN

            </div>

            <div id="tokyoCountdown" class="countdown">

                Closes in 00:00

            </div>

            <div class="progress">

                <div id="tokyoProgress"></div>

            </div>

        </div>

        <div class="session-card">

            <div class="session-name">

                🇬🇧 LONDON

            </div>

            <div id="londonClock" class="clock">

                00:00:00

            </div>

            <div id="londonStatus" class="status">

                CLOSED

            </div>

            <div id="londonCountdown" class="countdown">

                Opens in 00:00

            </div>

            <div class="progress">

                <div id="londonProgress"></div>

            </div>

        </div>

        <div class="session-card">

            <div class="session-name">

                🇺🇸 NEW YORK

            </div>

            <div id="newYorkClock" class="clock">

                00:00:00

            </div>

            <div id="newYorkStatus" class="status">

                OPEN

            </div>

            <div id="newYorkCountdown" class="countdown">

                Closes in 00:00

            </div>

            <div class="progress">

                <div id="newYorkProgress"></div>

            </div>

        </div>

    </section>

    <!-- MARKET STATUS -->

    <section class="panel">

        <div class="panel-title">

            MARKET STATUS

        </div>

        <div class="market-grid">

            <div>

                <span>Forex</span>

                <strong id="forexStatus">

                    🟢 OPEN

                </strong>

            </div>

            <div>

                <span>Crypto</span>

                <strong>

                    🟢 OPEN

                </strong>

            </div>

            <div>

                <span>US Market</span>

                <strong id="usStatus">

                    🔴 CLOSED

                </strong>

            </div>

        </div>

    </section>

    <!-- TIME PANEL -->

    <section class="panel">

        <div class="time-grid">

            <div>

                <small>UTC</small>

                <h3 id="utcClock">

                    00:00:00

                </h3>

            </div>

            <div>

                <small>LOCAL</small>

                <h3 id="localClock">

                    00:00:00

                </h3>

            </div>

            <div>

                <small>TODAY</small>

                <h3 id="todayDate">

                    Thursday, 06 August

                </h3>

            </div>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>
